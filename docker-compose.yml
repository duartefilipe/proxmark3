services:
  proxmark-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proxmark-web
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      PM3_HOST: 0.0.0.0
      PM3_PORT: 8787
      PM3_TTY: /dev/ttyACM0
      # Aponta para o Postgres ja existente no servidor (container postgres-anakin)
      PM3_PGHOST: ${PM3_PGHOST:-192.168.31.229}
      PM3_PGPORT: ${PM3_PGPORT:-15432}
      PM3_PGDATABASE: ${PM3_PGDATABASE:-proxmark}
      PM3_PGUSER: ${PM3_PGUSER:-proxmark}
      PM3_PGPASSWORD: ${PM3_PGPASSWORD}
    # Porta publicada no host. Aparece clicavel na lista de containers do
    # Portainer (coluna "Published Ports").
    ports:
      - "0.0.0.0:${PM3_WEB_PORT:-8787}:8787/tcp"
    # Acesso ao Proxmark3 conectado na USB do host.
    # Requer que /dev/ttyACM0 exista no host que executa o Docker.
    devices:
      - "${PM3_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    # Durante o reflash o aparelho reenumera no modo bootloader e o device
    # node pode ser recriado. A regra abaixo permite ao container continuar
    # enxergando o novo node sem precisar recriar a stack.
    device_cgroup_rules:
      - "c 166:* rmw"
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/status', timeout=5)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
